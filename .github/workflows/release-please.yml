name: release-please

# Keeps a release PR open from the Conventional Commits merged to main. Merging it
# tags vX.Y.Z and publishes a GitHub Release, and new VMs install the newest tag.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write
  issues: write   # the autorelease labels that mark what to tag go through the issues API

# Back-to-back merges must not race on the same release branch or tag.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
