name: CI

# Run the installer integration test on every PR and on main.
on:
  push:
    branches: [main]
  pull_request:

# Least-privilege token: the job only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref instead of piling up duplicates.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  integration-test:
    name: install + verify (debian ${{ matrix.debian }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        debian: [bookworm, trixie]
    steps:
      - uses: actions/checkout@v7

      - name: Run installer integration test in Debian ${{ matrix.debian }}
        run: |
          docker run --rm -v "$PWD":/repo:ro "debian:${{ matrix.debian }}" \
            bash /repo/tests/integration-test.sh
