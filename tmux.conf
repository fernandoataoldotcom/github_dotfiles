# Split windows using \ and -
unbind '"'
unbind %
bind '\' split-window -h
bind - split-window -v

# vim binding for pane navigation
bind h select-pane -L
bind l  select-pane -R
bind k select-pane -U
bind j select-pane -D

# set default shell to zsh
set-option -g default-shell /usr/bin/zsh

# Name a pane (prefix N); every pane shows "index title" on its top border.
# Programs can retitle it too (Claude Code sets it to the task).
bind-key N command-prompt -I "#T" "select-pane -T '%%'"
set -g pane-border-status top
set -g pane-border-format "#{pane_index} #{pane_title}"

# prefix o, then keep tapping o (no prefix) to cycle through the panes.
bind-key -r o select-pane -t :.+

# prefix ? shows our cheat sheet instead of every binding (prefix : list-keys for those).
bind-key ? display-popup -w 70 -h 90% -E 'less ~/.tmux-cheatsheet.txt'
